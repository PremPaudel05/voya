<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .dark { fill: #2a2118; }
      .rust { fill: #b9743a; }
      .ring { fill: none; stroke: #2a2118; }
    </style>
  </defs>

  <!-- outer thin ring -->
  <circle cx="100" cy="100" r="92" class="ring" stroke-width="3"/>
  <g class="dark">
    <circle cx="100" cy="10" r="2.4"/>
    <circle cx="100" cy="190" r="2.4"/>
    <circle cx="10" cy="100" r="2.4"/>
    <circle cx="190" cy="100" r="2.4"/>
  </g>

  <!-- 8-point compass rose -->
  <g transform="translate(100,100)">
    <!-- long N-E-S-W points -->
    <path d="M 0 0 L -4.6 -21.5 L 0 -78 L 4.6 -21.5 Z" class="dark"/>
    <path d="M 0 0 L 21.5 -4.6 L 78 0 L 21.5 4.6 Z" class="dark"/>
    <path d="M 0 0 L 4.6 21.5 L 0 78 L -4.6 21.5 Z" class="dark"/>
    <path d="M 0 0 L -21.5 4.6 L -78 0 L -21.5 -4.6 Z" class="dark"/>

    <!-- short diagonal points -->
    <path d="M 0 0 L 12 -18.5 L 35.4 -35.4 L 18.5 -12 Z" class="rust"/>
    <path d="M 0 0 L 18.5 12 L 35.4 35.4 L 12 18.5 Z" class="rust"/>
    <path d="M 0 0 L -12 18.5 L -35.4 35.4 L -18.5 12 Z" class="rust"/>
    <path d="M 0 0 L -18.5 -12 L -35.4 -35.4 L -12 -18.5 Z" class="rust"/>

    <!-- center pin -->
    <circle cx="0" cy="0" r="9" class="dark"/>
    <circle cx="0" cy="0" r="3.5" fill="#f2ece1"/>
  </g>
</svg>
