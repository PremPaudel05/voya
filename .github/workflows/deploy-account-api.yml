name: Deploy Voya account API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'shared/**'
      - '.github/workflows/deploy-account-api.yml'
permissions:
  contents: read
concurrency:
  group: voya-account-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Check deployment connection
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in this repository’s Actions secrets, then rerun this workflow. The token needs Workers Scripts:Edit and D1:Edit for the Voya account.'
            exit 1
          fi
      - run: npm ci
        working-directory: cloudflare
      - name: Verify backend
        working-directory: cloudflare
        run: |
          cp .dev.vars.example .dev.vars
          npm run types
          npm run check
          npm test
          rm .dev.vars
      - name: Apply account database migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply voya-accounts --remote
      - name: Deploy account service
        working-directory: cloudflare
        run: npm run deploy
      - name: Confirm settings API is live
        run: |
          node --input-type=module -e 'const r=await fetch("https://voya-account-api.voya-prempaudel05.workers.dev/config",{headers:{Origin:"https://voyatravel.vercel.app"}});if(!r.ok||(await r.json()).settingsVersion!==2)throw new Error("Account settings deployment verification failed");console.log("Account settings v2 is live");'
